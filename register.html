<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | IIUC Cycle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">↗</span><span>IIUC<span
                    class="brand-light">CYCLE</span><small>Campus Bicycle Rental</small></span></a><a class="text-link"
            href="index.html">← Back to home</a></header>
    <main class="auth-wrap register-wrap">
        <div class="auth-side"><span class="eyebrow">JOIN THE RIDE</span>
            <h1>Campus life,<br><em>in motion.</em></h1>
            <p>Create your student profile to explore the IIUC Cycle rental experience.</p>
            <div class="auth-illustration">🌿<span>MOVE SMARTER</span></div>
        </div>
        <form class="auth-card demo-form"><span class="eyebrow">STUDENT PORTAL</span>
            <h2>Create account</h2>
            <p class="muted">Fill in your university details to get started.</p>
            <div class="two-fields"><label>Full name<input required placeholder="Your full name"></label><label>Student
                    ID<input required placeholder="Student ID"></label></div><label>University email<input type="email"
                    required placeholder="name@iiuc.ac.bd"></label>
            <div class="two-fields"><label>Department<select required>
                        <option value="">Select department</option>
                        <option>CSE</option>
                        <option>EEE</option>
                        <option>Business Studies</option>
                        <option>English</option>
                        <option>Other</option>
                    </select></label><label>Phone number<input type="tel" required placeholder="+8801XXXXXXXXX"></label>
            </div>
            <div class="two-fields"><label>Password<input type="password" required minlength="6"
                        placeholder="At least 6 characters"></label><label>Confirm password<input type="password"
                        required minlength="6" placeholder="Repeat password"></label></div><button class="btn full"
                type="submit">Create student account ↗</button>
            <p class="form-foot">Already registered? <a href="login.html">Log in</a></p>
            <div class="demo-message" aria-live="polite"></div>
        </form>
    </main>
    <script src="script.js"></script>
</body>

</html>
